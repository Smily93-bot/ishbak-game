    <script>
      (function () {
        function showIshbakError(message) {
          if (document.getElementById("ishbak-runtime-error")) return;
          var box = document.createElement("div");
          box.id = "ishbak-runtime-error";
          box.dir = "rtl";
          box.style.cssText = "position:fixed;inset:20px;z-index:10000;margin:auto;max-width:520px;height:max-content;padding:22px;border-radius:18px;background:#fff4f1;color:#26355c;box-shadow:0 12px 40px rgba(38,53,92,.22);font:600 15px/1.7 system-ui,sans-serif;text-align:center";
          box.innerHTML = "<strong style='display:block;font-size:19px;margin-bottom:8px'>حدث خطأ أثناء فتح اللعبة</strong><span>صوّر هذه الرسالة وأرسلها لي:</span><br><code style='display:block;margin-top:10px;direction:ltr;overflow-wrap:anywhere'>" + String(message || "Unknown error").replace(/[&<>]/g, function (character) { return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[character]; }) + "</code>";
          document.body.appendChild(box);
        }
        window.addEventListener("error", function (event) {
          var message = event.error && event.error.message || event.message;
          // Safari hides details for some third-party/cross-origin script errors.
          // A generic "Script error." is not actionable and should not block the game.
          if (!event.error && (!message || message === "Script error.")) return;
          showIshbakError(message);
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && event.reason.message || event.reason;
          if (!reason || reason === "Script error.") return;
          showIshbakError(reason);
        });
      })();
    </script>
