name: Build signed Ishbak Google Play AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Ishbak-Android-GooglePlay-Source-with-AdMob.zip"
      - ".github/workflows/build-android-play.yml"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
      ISHBAK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ISHBAK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ISHBAK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Unzip Ishbak source
        run: unzip -q Ishbak-Android-GooglePlay-Source-with-AdMob.zip -d app

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$EXPO_PUBLIC_ADMOB_ANDROID_APP_ID"
          test -n "$EXPO_PUBLIC_ADMOB_BANNER_ID"
          test -n "$KEYSTORE_BASE64"
          test -n "$ISHBAK_UPLOAD_STORE_PASSWORD"
          test -n "$ISHBAK_UPLOAD_KEY_ALIAS"
          test -n "$ISHBAK_UPLOAD_KEY_PASSWORD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Apply production AdMob IDs
        working-directory: app
        run: node scripts/configure-admob.js

      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/android/app/ishbak-upload.jks

      - name: Configure release signing
        working-directory: app
        env:
          ISHBAK_UPLOAD_STORE_FILE: ${{ github.workspace }}/app/android/app/ishbak-upload.jks
        run: node scripts/configure-android-signing.js

      - name: Build signed AAB
        working-directory: app/android
        env:
          ISHBAK_UPLOAD_STORE_FILE: ${{ github.workspace }}/app/android/app/ishbak-upload.jks
        run: ./gradlew bundleRelease

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ishbak-Google-Play-AAB
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
